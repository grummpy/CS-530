[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "original-clay-fighter"
dynamic = ["version"]
description = "Local two-player 2D clay-style fighting-game prototype."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Christopher Decker" }]
dependencies = [
    "pygame-ce==2.5.8",
    "PyYAML==6.0.1",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "build==1.4.0",
    "pytest==9.0.3",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20250822",
    "setuptools==80.10.2",
    "wheel==0.46.3",
]

[project.scripts]
clay-fighter = "fighter.__main__:main"
clay-fighter-headless = "fighter.__main__:headless_main"

[tool.setuptools.dynamic]
version = {attr = "fighter.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fighter.resources" = ["assets/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fighter"]
